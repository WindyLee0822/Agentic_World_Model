# AML command job: serve Qwen in BF16 across two H100s and run one AppWorld
# task on the same node.
#
# Submit:
#   AML_QWEN_JOB_FILE=aml/job.qwen.appworld.yml \
#   bash aml/submit_qwen.sh --stream
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-appworld-qwen35-bf16-one-task
experiment_name: dw-appworld-qwen35-local
description: Serve post-trained Qwen3.5-35B-A3B in BF16 and run one AppWorld task.
compute: azureml:NC80adsv5-EUS-hipri
code: ..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment/conda.qwen.appworld.yml
inputs:
  appworld_data:
    type: uri_folder
    path: azureml:tts_appworld_data:20260606050627
  model: Qwen/Qwen3.5-35B-A3B
  served_name: Qwen3.5-35B-A3B
  port: 8000
  tp_size: 2
  max_model_len: 32768
  gpu_mem_util: 0.92
  quantization: none
  tool_call_parser: qwen3_xml
  language_model_only: 1
  enable_thinking: 1
  vllm_extra_args: --enable-expert-parallel
  server_timeout: 7200
  min_cache_free_gb: 100
  env: appworld
  methods: ours
  n: "1"
  agent: llm_wm
  splits: test_normal
  levels: "1"
  workers: 1
  max_steps: 40
  rollout_retries: 2
  cell_retries: 2
  temperature: 1.0
  stall_timeout: "7200"
  extra_args: --tasks 1
outputs:
  output_dir:
    type: uri_folder
command: >-
  bash aml/src/run_qwen.sh
  --model "${{inputs.model}}"
  --served-name "${{inputs.served_name}}"
  --port ${{inputs.port}}
  --tp-size ${{inputs.tp_size}}
  --max-model-len ${{inputs.max_model_len}}
  --gpu-mem-util ${{inputs.gpu_mem_util}}
  --quantization "${{inputs.quantization}}"
  --tool-call-parser "${{inputs.tool_call_parser}}"
  --language-model-only ${{inputs.language_model_only}}
  --enable-thinking ${{inputs.enable_thinking}}
  --vllm-extra-args "${{inputs.vllm_extra_args}}"
  --server-timeout ${{inputs.server_timeout}}
  --min-cache-free-gb ${{inputs.min_cache_free_gb}}
  --env "${{inputs.env}}"
  --appworld-data "${{inputs.appworld_data}}"
  --output-dir "${{outputs.output_dir}}"
  --methods "${{inputs.methods}}"
  --n "${{inputs.n}}"
  --agent "${{inputs.agent}}"
  --splits "${{inputs.splits}}"
  --levels "${{inputs.levels}}"
  --workers ${{inputs.workers}}
  --max-steps ${{inputs.max_steps}}
  --rollout-retries ${{inputs.rollout_retries}}
  --cell-retries ${{inputs.cell_retries}}
  --temperature ${{inputs.temperature}}
  --stall-timeout "${{inputs.stall_timeout}}"
  --extra-args "${{inputs.extra_args}}"
