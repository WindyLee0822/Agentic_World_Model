# Single AML command job: runs dw's experiments/run.py on real AppWorld.
#
# Submit with the Azure CLI ML extension (already installed + `az login` done):
#   az ml job create -f aml/job.yml -g Singularity -w M365Research \
#       --subscription acc09744-1ee3-4242-b375-93421c63af0c
#
# Override inputs at submit time, e.g. a quick smoke test:
#   az ml job create -f aml/job.yml -g Singularity -w M365Research \
#       --set inputs.workers=4 inputs.n="1,2" inputs.methods="ours" \
#             display_name=dw-smoke
#
# Paths (`code`, `environment.conda_file`) are resolved relative to THIS file.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-AppWorld-BoN
experiment_name: dw-appworld
description: Run the dw test-time-scaling harness (AWM and real-environment BoN) on real AppWorld on AML compute.
compute: azureml:D15v2-NCUS-hipri
code: ..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment/conda.appworld.yml
inputs:
  appworld_data:
    type: uri_folder
    path: azureml:tts_appworld_data:20260606050627
  env: appworld
  methods: ours
  n: "1,2,4,8"
  agent: llm_wm
  splits: test_normal
  levels: "1"
  workers: 8
  max_steps: 40
  temperature: 1.0
  stall_timeout: "3600"
  extra_args: none
  aoai_endpoint: https://aidaihub2294673195.cognitiveservices.azure.com
  aoai_deployment: gpt-4.1
  aoai_api_version: 2024-12-01-preview
  aoai_api_key: none
  managed_identity_client_id: 258f6dab-3e80-4254-83e3-bfb24a9ae8d9
outputs:
  output_dir:
    type: uri_folder
command: >-
  bash aml/src/run_dw.sh
  --env "${{inputs.env}}"
  --appworld-data "${{inputs.appworld_data}}"
  --output-dir "${{outputs.output_dir}}"
  --methods "${{inputs.methods}}"
  --n "${{inputs.n}}"
  --agent "${{inputs.agent}}"
  --splits "${{inputs.splits}}"
  --levels "${{inputs.levels}}"
  --workers ${{inputs.workers}}
  --max-steps ${{inputs.max_steps}}
  --temperature ${{inputs.temperature}}
  --aoai-endpoint "${{inputs.aoai_endpoint}}"
  --aoai-deployment "${{inputs.aoai_deployment}}"
  --aoai-api-version "${{inputs.aoai_api_version}}"
  --aoai-api-key "${{inputs.aoai_api_key}}"
  --managed-identity-client-id "${{inputs.managed_identity_client_id}}"
  --stall-timeout "${{inputs.stall_timeout}}"
  --extra-args "${{inputs.extra_args}}"
