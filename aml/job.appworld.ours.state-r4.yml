$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-appworld-ours-state-r4-pilot
experiment_name: dw-appworld-ours-deepseek-repair
description: Ours-only isolated model transport fixes guarded OBO refresh; complete
  bounded Python outputs and simulated GET-download transitions; interruption-safe response matching and 600s cells; ordered logical-state preconditions.
compute: azureml:GWC-NC24ads-A100-hipri
code: ..
environment: azureml:CliV2AnonymousEnvironment:9872fac1b843bfd01c9cdaf22251013c978c50c12d30b505334dcb04199a7be0
identity:
  type: user_identity
inputs:
  appworld_data:
    type: uri_folder
    path: azureml:tts_appworld_data:20260606050627
    mode: ro_mount
  extra_args: --tasks 1 --predict-all-actions
environment_variables:
  TTS_APPWORLD_PREDICT_ALL_PROGRAM_ONLY: '1'
  TTS_APPWORLD_PREGROUND_CLEAN_READS: '0'
  TTS_APPWORLD_DETERMINISTIC_GROUNDED_CLEAN_READS: '0'
  TTS_APPWORLD_AGENT_REFERENCE: '0'
  TTS_APPWORLD_INSTRUCTION_PREFLIGHTS: '0'
outputs:
  output_dir:
    type: uri_folder
command: export TTS_APPWORLD_OURS_DIAGNOSTICS_DIR="${{outputs.output_dir}}/wm_diagnostics"
  && conda env create --yes --prefix /tmp/tts-appworld-ours-repair --file aml/environment/conda.appworld.yml
  && conda run --no-capture-output --prefix /tmp/tts-appworld-ours-repair bash aml/src/run_dw.sh
  --env appworld --appworld-data "${{inputs.appworld_data}}" --output-dir "${{outputs.output_dir}}"
  --methods ours --n "2" --agent llm_wm --splits "test_normal,test_challenge" --levels
  "1,2,3" --workers 4 --max-steps 40 --temperature 1 --aoai-endpoint "https://ai-m365researchefficientaieus2212654625773.cognitiveservices.azure.com/"
  --aoai-deployment "DeepSeek-V4-Pro" --aoai-api-version "2024-12-01-preview" --aoai-api-key
  none --managed-identity-client-id "3cd4a6ca-c848-40dd-bb6f-e6f20c7f0755" --stall-timeout
  7200 --extra-args "--strict-coverage ${{inputs.extra_args}}"
