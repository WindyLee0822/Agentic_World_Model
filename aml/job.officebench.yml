# AML command job: runs dw's experiments/run.py on OfficeBench.
#
# ┌────────────────────────────────────────────────────────────────────────┐
# │ Standard AML command compute cannot start nested Docker. This job uses   │
# │ the Docker CLI as a client and can connect over SSH to a separate Linux  │
# │ VM with Docker. The SSH private key is fetched from Azure Key Vault by   │
# │ the job's managed identity; it is never embedded in this YAML.           │
# └────────────────────────────────────────────────────────────────────────┘
#
# Register the OfficeBench clone:
#   az ml data create --name officebench_clone --version 1 \
#       --type uri_folder --path /home/t-wendili/OfficeBench \
#       -g Singularity -w M365Research
#
# `aml/submit.sh` creates or reuses the Docker VM, stores its SSH credentials in
# the workspace Key Vault, and injects these four inputs automatically. They
# remain overrideable for an existing Docker host.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-OfficeBench-BoN
experiment_name: dw-officebench
description: Run OfficeBench from AML using a Docker daemon on a separate SSH-accessible VM.
compute: azureml:D15v2-NCUS-hipri
code: ..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment/conda.yml
inputs:
  env: officebench
  officebench_root:
    type: uri_folder
    path: azureml:officebench_clone:1
  docker_host: none
  docker_key_vault_url: none
  docker_ssh_key_secret: none
  docker_ssh_known_hosts_secret: none
  levels: "1"            # OfficeBench uses --levels as app-counts: 1 / 2 / 3 apps
  methods: b0,b1,b2,ours
  n: "1,2,4,8"
  agent: llm
  workers: 8
  max_steps: 40
  temperature: 0.7
  stall_timeout: "3600"
  extra_args: none
  aoai_endpoint: https://aidaihub2294673195.cognitiveservices.azure.com
  aoai_deployment: gpt-4.1
  aoai_api_version: 2024-12-01-preview
  aoai_api_key: none
  managed_identity_client_id: 258f6dab-3e80-4254-83e3-bfb24a9ae8d9
outputs:
  output_dir:
    type: uri_folder
command: >-
  bash aml/src/run_dw.sh
  --env "${{inputs.env}}"
  --officebench-root "${{inputs.officebench_root}}"
  --docker-host "${{inputs.docker_host}}"
  --docker-key-vault-url "${{inputs.docker_key_vault_url}}"
  --docker-ssh-key-secret "${{inputs.docker_ssh_key_secret}}"
  --docker-ssh-known-hosts-secret "${{inputs.docker_ssh_known_hosts_secret}}"
  --output-dir "${{outputs.output_dir}}"
  --levels "${{inputs.levels}}"
  --methods "${{inputs.methods}}"
  --n "${{inputs.n}}"
  --agent "${{inputs.agent}}"
  --workers ${{inputs.workers}}
  --max-steps ${{inputs.max_steps}}
  --temperature ${{inputs.temperature}}
  --aoai-endpoint "${{inputs.aoai_endpoint}}"
  --aoai-deployment "${{inputs.aoai_deployment}}"
  --aoai-api-version "${{inputs.aoai_api_version}}"
  --aoai-api-key "${{inputs.aoai_api_key}}"
  --managed-identity-client-id "${{inputs.managed_identity_client_id}}"
  --stall-timeout "${{inputs.stall_timeout}}"
  --extra-args "${{inputs.extra_args}}"
