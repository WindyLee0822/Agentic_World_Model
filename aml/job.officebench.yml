# AML command job: runs dw's experiments/run.py on OfficeBench.
#
# Standard AML command compute cannot start nested Docker. This job uses the
# baked OfficeBench local backend, which runs the same official apps/evaluator
# in-process against an isolated temporary task root.
#
# Register the OfficeBench clone:
#   az ml data create --name officebench_clone --version 1 \
#       --type uri_folder --path /home/t-wendili/OfficeBench \
#       -g Singularity -w M365Research
#
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-OfficeBench-BoN
experiment_name: dw-officebench
description: Run OfficeBench on standard AML compute with the no-Docker local backend.
compute: azureml:D15v2-NCUS-hipri
code: ..
environment: azureml:tts-officebench-local:20260803
environment_variables:
  TTS_OFFICEBENCH_BACKEND: local
  TTS_OFFICEBENCH_WM_PYTHON_TIMEOUT_S: "5"
inputs:
  env: officebench
  officebench_root:
    type: uri_folder
    path: azureml:officebench_clone:1
  levels: "1"            # OfficeBench uses --levels as app-counts: 1 / 2 / 3 apps
  methods: ours
  n: "1,2,4,8"
  agent: llm_wm
  workers: 8
  max_steps: 40
  temperature: 1
  stall_timeout: "3600"
  # Use model/method defaults; GPT and DeepSeek Ours predict all candidate observations.
  extra_args: none
  aoai_endpoint: https://aidaihub2294673195.cognitiveservices.azure.com
  aoai_deployment: gpt-5.4
  aoai_api_version: 2024-12-01-preview
  aoai_api_key: none
  managed_identity_client_id: 258f6dab-3e80-4254-83e3-bfb24a9ae8d9
outputs:
  output_dir:
    type: uri_folder
command: >-
  bash aml/src/run_dw.sh
  --env "${{inputs.env}}"
  --officebench-root "${{inputs.officebench_root}}"
  --output-dir "${{outputs.output_dir}}"
  --levels "${{inputs.levels}}"
  --methods "${{inputs.methods}}"
  --n "${{inputs.n}}"
  --agent "${{inputs.agent}}"
  --workers ${{inputs.workers}}
  --max-steps ${{inputs.max_steps}}
  --temperature ${{inputs.temperature}}
  --aoai-endpoint "${{inputs.aoai_endpoint}}"
  --aoai-deployment "${{inputs.aoai_deployment}}"
  --aoai-api-version "${{inputs.aoai_api_version}}"
  --aoai-api-key "${{inputs.aoai_api_key}}"
  --managed-identity-client-id "${{inputs.managed_identity_client_id}}"
  --stall-timeout "${{inputs.stall_timeout}}"
  --extra-args "${{inputs.extra_args}}"
