# AML environment for the `dw` tau2-bench + OfficeBench jobs (mirrors the local
# `dw` conda env: Python 3.12, pydantic 2).
#
# NOTE on env profiles (they are MUTUALLY EXCLUSIVE):
#   * tau2 + officebench  -> THIS file (Python 3.12, pydantic 2).
#   * appworld            -> conda.appworld.yml (Python 3.11, pydantic <2).
#   AppWorld pins pydantic<2 while tau2 needs pydantic>=2, so they cannot share
#   one environment. Point job.yml `environment.conda_file` at the right one.
#
# tau2-bench is NOT on PyPI under `tau2` (that name is an unrelated package), so
# it is installed from the upstream git repo, pinned to the commit that matches
# the local `dw` checkout. The `[knowledge]` extra adds rank-bm25 for the
# banking_knowledge domain.
#
# OfficeBench needs NO Python deps here: its app + evaluation code runs inside a
# per-rollout Docker container. The compute host instead needs the `docker` CLI,
# a usable Docker daemon, and the OFFICEBENCH_ROOT clone (see aml/README.md).
name: tts-dw-aml
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - "tau2[knowledge] @ git+https://github.com/sierra-research/tau2-bench.git@1746a25db265724f6fed2260934bb67f1514fad7"
      - openai>=1.30.0
      - azure-identity>=1.15.0
      - pyyaml>=6.0
      - tqdm>=4.66.0
