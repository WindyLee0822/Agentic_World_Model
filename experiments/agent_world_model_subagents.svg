<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9fb2cc"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#36d399"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 43px; font-weight: 700; fill: #edf3fb; }
      .subtitle { font-family: Arial, sans-serif; font-size: 21px; fill: #a9bad1; }
      .section { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.3px; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #edf3fb; }
      .subTitle { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #edf3fb; }
      .body { font-family: Arial, sans-serif; font-size: 18px; fill: #afbed2; }
      .strong { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #dce7f6; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #8fa5c0; }
      .micro { font-family: Arial, sans-serif; font-size: 12px; fill: #8fa5c0; }
      .code { font-family: 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #b9c8db; }
      .pill { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #d4e0ee; }
      .connectorLabel { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #dce7f6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0e192b"/>
  <text x="72" y="72" class="title">Agent ↔ World Model Interaction</text>
  <text x="72" y="109" class="subtitle">The router is ordinary harness code; prediction and verification are separate LLM subagents.</text>

  <!-- Agent -->
  <rect x="75" y="206" width="320" height="460" rx="24" fill="#1a3253" stroke="#578bd0" stroke-width="2.5"/>
  <rect x="98" y="229" width="142" height="37" rx="18.5" fill="#26466f"/>
  <text x="169" y="254" text-anchor="middle" class="section" fill="#b9d6fb">AGENT</text>
  <text x="115" y="315" class="boxTitle">Official Agent LLM</text>
  <text x="115" y="366" class="strong">What it does</text>
  <text x="115" y="402" class="body">• Chooses the next tool call</text>
  <text x="115" y="435" class="body">• Reads the returned observation</text>
  <text x="115" y="468" class="body">• Continues the task dialogue</text>
  <text x="115" y="501" class="body">• Stops with a final response</text>
  <rect x="108" y="550" width="252" height="78" rx="15" fill="#142944" stroke="#426b9e"/>
  <text x="234" y="580" text-anchor="middle" class="strong">No privileged state access</text>
  <text x="234" y="607" text-anchor="middle" class="small">sees only tools + observations</text>

  <!-- Router / harness -->
  <rect x="465" y="278" width="270" height="300" rx="22" fill="#1d293a" stroke="#667a94" stroke-width="2"/>
  <rect x="487" y="300" width="202" height="35" rx="17.5" fill="#2a3a4e"/>
  <text x="588" y="324" text-anchor="middle" class="section" fill="#d0dae6">ROUTER / HARNESS</text>
  <text x="502" y="377" class="strong">Ordinary code, not an LLM</text>
  <text x="502" y="414" class="body">• Intercepts every tool call</text>
  <text x="502" y="447" class="body">• Tracks action history</text>
  <text x="502" y="480" class="body">• Tracks clean vs. dirty state</text>
  <text x="502" y="513" class="body">• Invokes the right subagent</text>
  <text x="600" y="551" text-anchor="middle" class="code">get_response / requester</text>

  <!-- Agent-router arrows -->
  <line x1="395" y1="365" x2="451" y2="365" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="394" y="332" width="64" height="23" rx="11.5" fill="#172b47" stroke="#4d82c4"/>
  <text x="426" y="348" text-anchor="middle" class="connectorLabel">tool call</text>
  <line x1="451" y1="500" x2="409" y2="500" stroke="#9fb2cc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="389" y="511" width="82" height="23" rx="11.5" fill="#202d40" stroke="#667a94"/>
  <text x="430" y="527" text-anchor="middle" class="connectorLabel">observation</text>

  <!-- World model -->
  <rect x="805" y="160" width="720" height="570" rx="25" fill="#221e3d" stroke="#8d5cc5" stroke-width="2.5"/>
  <rect x="830" y="183" width="220" height="38" rx="19" fill="#38265b"/>
  <text x="940" y="209" text-anchor="middle" class="section" fill="#e0c9fb">WORLD MODEL</text>
  <rect x="1258" y="183" width="238" height="38" rx="19" fill="#123d35" stroke="#2a8b70"/>
  <text x="1377" y="209" text-anchor="middle" class="section" fill="#75e7c2">READ-ONLY GROUNDING</text>

  <!-- Prediction subagent -->
  <rect x="840" y="255" width="315" height="360" rx="19" fill="#31234e" stroke="#a56be2" stroke-width="2"/>
  <circle cx="870" cy="286" r="10" fill="#c084fc"/>
  <text x="892" y="294" class="subTitle">Observation predictor</text>
  <text x="865" y="338" class="strong">Runs for each routed tool call</text>
  <text x="865" y="373" class="body">• Predicts the exact tool response</text>
  <text x="865" y="405" class="body">• Checks write preconditions</text>
  <text x="865" y="437" class="body">• Updates candidate-only state</text>

  <rect x="865" y="472" width="265" height="117" rx="15" fill="#173b39" stroke="#38a385"/>
  <text x="997" y="499" text-anchor="middle" class="strong" fill="#b6efdc">Its read-grounding loop</text>
  <text x="997" y="528" text-anchor="middle" class="code">PYTHON_READ → host read</text>
  <text x="997" y="555" text-anchor="middle" class="code">PYTHON_FINAL → observation</text>
  <text x="997" y="578" text-anchor="middle" class="micro">bounded; only when more evidence is needed</text>

  <!-- Verification subagent -->
  <rect x="1190" y="255" width="300" height="360" rx="19" fill="#19364b" stroke="#4da8c7" stroke-width="2"/>
  <circle cx="1220" cy="286" r="10" fill="#67d0e8"/>
  <text x="1242" y="294" class="subTitle">Success verifier</text>
  <text x="1215" y="338" class="strong">Runs after the trajectory ends</text>
  <text x="1215" y="373" class="body">• Audits actions + final state</text>
  <text x="1215" y="405" class="body">• Checks gold/native criteria</text>
  <text x="1215" y="437" class="body">• Returns success / confidence</text>

  <rect x="1215" y="472" width="250" height="117" rx="15" fill="#173b39" stroke="#38a385"/>
  <text x="1340" y="499" text-anchor="middle" class="strong" fill="#b6efdc">Its own read-grounding loop</text>
  <text x="1340" y="528" text-anchor="middle" class="code">PYTHON_READ → host read</text>
  <text x="1340" y="555" text-anchor="middle" class="code">PYTHON_FINAL → verdict</text>
  <text x="1340" y="578" text-anchor="middle" class="micro">can gather evidence independently</text>

  <!-- Shared memory -->
  <rect x="930" y="642" width="470" height="59" rx="18" fill="#292a47" stroke="#6b7496"/>
  <text x="1165" y="666" text-anchor="middle" class="strong">Shared candidate context</text>
  <text x="1165" y="690" text-anchor="middle" class="small">task · action history · observations · predicted state · read results</text>

  <!-- Router to WM -->
  <line x1="735" y1="365" x2="826" y2="365" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <rect x="742" y="332" width="78" height="23" rx="11.5" fill="#302247" stroke="#8d5cc5"/>
  <text x="781" y="348" text-anchor="middle" class="connectorLabel">predict call</text>
  <line x1="826" y1="500" x2="749" y2="500" stroke="#9fb2cc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="737" y="511" width="102" height="23" rx="11.5" fill="#202d40" stroke="#667a94"/>
  <text x="788" y="527" text-anchor="middle" class="connectorLabel">predicted result</text>

  <!-- Internal WM relationships -->
  <line x1="1155" y1="405" x2="1176" y2="405" stroke="#67d0e8" stroke-width="2.25" marker-end="url(#arrow)"/>
  <rect x="1127" y="370" width="76" height="23" rx="11.5" fill="#20364c" stroke="#4da8c7"/>
  <text x="1165" y="386" text-anchor="middle" class="connectorLabel">trajectory</text>
  <path d="M998 615 L998 629" fill="none" stroke="#c084fc" stroke-width="2.25" marker-end="url(#arrowPurple)"/>
  <path d="M1340 629 L1340 615" fill="none" stroke="#67d0e8" stroke-width="2.25" marker-end="url(#arrow)"/>

  <!-- Read-only backing state -->
  <rect x="375" y="774" width="850" height="77" rx="22" fill="#123d35" stroke="#2f9679" stroke-width="2"/>
  <text x="800" y="804" text-anchor="middle" class="boxTitle" fill="#b7f1df">Pristine task state / read-only tools</text>
  <text x="800" y="832" text-anchor="middle" class="body" fill="#8fd4bd">The host executes validated reads; neither subagent receives a database or write handle.</text>

  <path d="M720 774 C720 720 997 720 997 603" fill="none" stroke="#36d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1020 774 C1020 720 1340 720 1340 603" fill="none" stroke="#36d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Clarifying note -->
  <rect x="78" y="706" width="625" height="44" rx="18" fill="#17273c" stroke="#405674"/>
  <text x="390" y="734" text-anchor="middle" class="pill">“Transition simulation” = the observation predictor’s job, not a separate harness.</text>
</svg>
