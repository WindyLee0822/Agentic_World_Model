# AML environment for serving Qwen with vLLM and running AppWorld in the same
# GPU command job. The AppWorld source pin matches the mounted 0.2.0 data asset.
name: tts-dw-qwen-appworld-aml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "vllm==0.24.0"
      - appworld @ https://github.com/StonyBrookNLP/appworld/archive/a072b7a86e7c1d5b1d7175659d750ebb9b79f10a.zip
      # vLLM 0.24 requires OpenAI SDK 2.x. dw uses the stable
      # OpenAI/AzureOpenAI client surface that remains available in 2.x.
      - openai>=2.0.0
      - azure-identity>=1.15.0
      - pyyaml>=6.0
      - tqdm>=4.66.0
