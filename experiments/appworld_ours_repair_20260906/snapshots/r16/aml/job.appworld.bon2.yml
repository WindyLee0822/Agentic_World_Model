# GPT-4.1 AppWorld Python-only multi-app BoN@2 gate.
#
# Submit and stream:
#   AML_JOB_FILE=aml/job.appworld.bon2.yml bash aml/submit.sh --stream
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: dw-AppWorld-Python-MultiApp-BoN2-gpt41
experiment_name: dw-appworld-python-multiapp-bon2-gpt41
description: Run the complete AppWorld L2/L3 Python-only WM BoN@2 gate with GPT-4.1 and graded per-check selection.
compute: azureml:D15v2-NCUS-hipri
code: ..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment/conda.appworld.yml
inputs:
  appworld_data:
    type: uri_folder
    path: azureml:tts_appworld_data:20260606050627
  env: appworld
  methods: ours
  n: "2"
  agent: llm_wm
  appworld_wm_tool_mode: python
  splits: test_normal,test_challenge
  levels: "2,3"
  workers: 8
  max_steps: 40
  rollout_retries: 2
  cell_retries: 2
  temperature: 1
  stall_timeout: "7200"
  benchmark_gate: appworld_bon2
  extra_args: --appworld-precision-prompt --appworld-agent-reference --appworld-deterministic-dirty-reads --verifier-percheck --success-score simulator_confidence
  aoai_endpoint: https://aidaihub2294673195.cognitiveservices.azure.com
  aoai_deployment: gpt-4.1
  aoai_api_version: 2024-12-01-preview
  aoai_api_key: none
  managed_identity_client_id: 258f6dab-3e80-4254-83e3-bfb24a9ae8d9
outputs:
  output_dir:
    type: uri_folder
command: >-
  bash aml/src/run_dw.sh
  --env "${{inputs.env}}"
  --appworld-data "${{inputs.appworld_data}}"
  --output-dir "${{outputs.output_dir}}"
  --methods "${{inputs.methods}}"
  --n "${{inputs.n}}"
  --agent "${{inputs.agent}}"
  --appworld-wm-tool-mode "${{inputs.appworld_wm_tool_mode}}"
  --splits "${{inputs.splits}}"
  --levels "${{inputs.levels}}"
  --workers ${{inputs.workers}}
  --max-steps ${{inputs.max_steps}}
  --rollout-retries ${{inputs.rollout_retries}}
  --cell-retries ${{inputs.cell_retries}}
  --temperature ${{inputs.temperature}}
  --aoai-endpoint "${{inputs.aoai_endpoint}}"
  --aoai-deployment "${{inputs.aoai_deployment}}"
  --aoai-api-version "${{inputs.aoai_api_version}}"
  --aoai-api-key "${{inputs.aoai_api_key}}"
  --managed-identity-client-id "${{inputs.managed_identity_client_id}}"
  --stall-timeout "${{inputs.stall_timeout}}"
  --benchmark-gate "${{inputs.benchmark_gate}}"
  --extra-args "${{inputs.extra_args}}"
