compute: azureml:GWC-NC24ads-A100-hipri
code: azureml:/subscriptions/acc09744-1ee3-4242-b375-93421c63af0c/resourceGroups/external-collaborations/providers/Microsoft.MachineLearningServices/workspaces/M365Research-External-EUS/codes/e997c025-0507-491a-83f5-a22c5277d280/versions/1
