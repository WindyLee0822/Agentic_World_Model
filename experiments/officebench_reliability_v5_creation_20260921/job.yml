  --workers ${{inputs.workers}} --max-steps ${{inputs.max_steps}} --temperature ${{inputs.temperature}}
  --aoai-endpoint "${{inputs.aoai_endpoint}}" --aoai-deployment "${{inputs.aoai_deployment}}"
  --aoai-api-version "${{inputs.aoai_api_version}}" --aoai-api-key "${{inputs.aoai_api_key}}"
  --managed-identity-client-id "${{inputs.managed_identity_client_id}}" --stall-timeout
