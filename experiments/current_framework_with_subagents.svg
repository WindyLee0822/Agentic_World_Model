<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9fb2cc"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#36d399"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #edf3fb; }
      .subtitle { font-family: Arial, sans-serif; font-size: 21px; fill: #a9bad1; }
      .bandTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #edf3fb; }
      .subTitle { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #edf3fb; }
      .body { font-family: Arial, sans-serif; font-size: 17px; fill: #afbed2; }
      .subBody { font-family: Arial, sans-serif; font-size: 15px; fill: #afbed2; }
      .strong { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #dce7f6; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #8fa5c0; }
      .pill { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #cbd8e9; }
      .number { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1322; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0e192b"/>

  <text x="72" y="70" class="title">Current Read-Grounded TTS Framework</text>
  <text x="72" y="106" class="subtitle">Three specialized world-model subagents collaborate while the real task state remains untouched.</text>

  <!-- Sampling -->
  <rect x="55" y="145" width="1490" height="525" rx="24" fill="#172943" stroke="#344d6e" stroke-width="2"/>
  <rect x="78" y="166" width="330" height="38" rx="19" fill="#263d5d"/>
  <text x="99" y="192" class="bandTitle" fill="#b7d2f6">SAMPLING · N CANDIDATES</text>
  <rect x="1278" y="166" width="238" height="38" rx="19" fill="#123d35" stroke="#27876c"/>
  <text x="1397" y="192" text-anchor="middle" class="bandTitle" fill="#72e8c2">ZERO REAL WRITES</text>

  <!-- Agent -->
  <rect x="92" y="252" width="270" height="270" rx="20" fill="#1b3355" stroke="#5688cd" stroke-width="2"/>
  <circle cx="132" cy="291" r="19" fill="#60a5fa"/>
  <text x="132" y="297" text-anchor="middle" class="number">1</text>
  <text x="164" y="299" class="boxTitle">Official agent × N</text>
  <text x="132" y="348" class="strong">Generates candidates</text>
  <text x="132" y="384" class="body">Uses the official task prompt</text>
  <text x="132" y="416" class="body">Calls normal benchmark tools</text>
  <text x="132" y="448" class="body">Receives WM-predicted results</text>
  <text x="132" y="480" class="body">Repeats until task completion</text>

  <!-- World model outer -->
  <rect x="438" y="224" width="820" height="395" rx="22" fill="#211e3b" stroke="#8c5bc3" stroke-width="2.5"/>
  <circle cx="478" cy="263" r="19" fill="#c084fc"/>
  <text x="478" y="269" text-anchor="middle" class="number">2</text>
  <text x="510" y="271" class="boxTitle">World-model team</text>
  <text x="733" y="271" class="small">restricted Python · bounded evidence · candidate-local state</text>

  <!-- Reader subagent -->
  <rect x="470" y="305" width="225" height="190" rx="16" fill="#173842" stroke="#3ba88c" stroke-width="2"/>
  <circle cx="493" cy="330" r="9" fill="#36d399"/>
  <text x="512" y="337" class="subTitle">Evidence reader</text>
  <text x="490" y="373" class="strong">Ground what is needed</text>
  <text x="490" y="404" class="subBody">• Ask safe read tools</text>
  <text x="490" y="433" class="subBody">• Recurse if uncertain</text>
  <text x="490" y="462" class="subBody">• No write access</text>

  <!-- Simulator subagent -->
  <rect x="728" y="305" width="245" height="190" rx="16" fill="#31234e" stroke="#a66be4" stroke-width="2"/>
  <circle cx="751" cy="330" r="9" fill="#c084fc"/>
  <text x="770" y="337" class="subTitle">Transition simulator</text>
  <text x="748" y="373" class="strong">Predict each tool result</text>
  <text x="748" y="404" class="subBody">• Check preconditions</text>
  <text x="748" y="433" class="subBody">• Predict response + transition</text>
  <text x="748" y="462" class="subBody">• Keep writes candidate-local</text>

  <!-- Verifier subagent -->
  <rect x="1006" y="305" width="220" height="190" rx="16" fill="#19354a" stroke="#4ea8c6" stroke-width="2"/>
  <circle cx="1029" cy="330" r="9" fill="#67d0e8"/>
  <text x="1048" y="337" class="subTitle">Outcome verifier</text>
  <text x="1026" y="373" class="strong">Judge the final outcome</text>
  <text x="1026" y="404" class="subBody">• Audit predicted final state</text>
  <text x="1026" y="433" class="subBody">• Apply native success checks</text>
  <text x="1026" y="462" class="subBody">• Return score + validity</text>

  <!-- Shared state -->
  <rect x="610" y="532" width="485" height="56" rx="18" fill="#272843" stroke="#697294"/>
  <text x="852" y="556" text-anchor="middle" class="strong">Shared candidate memory</text>
  <text x="852" y="578" text-anchor="middle" class="small">read cache · action history · transition log · predicted final state</text>

  <!-- Internal WM arrows -->
  <line x1="695" y1="400" x2="714" y2="400" stroke="#36d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="973" y1="400" x2="992" y2="400" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M850 495 L850 518" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M1090 518 C1090 510 1110 510 1110 495" fill="none" stroke="#67d0e8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agent-WM interaction -->
  <line x1="362" y1="348" x2="424" y2="348" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <text x="393" y="334" text-anchor="middle" class="small">tool call</text>
  <line x1="424" y1="470" x2="376" y2="470" stroke="#9fb2cc" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Pristine state -->
  <rect x="105" y="558" width="420" height="52" rx="20" fill="#123d35" stroke="#2d9578"/>
  <text x="315" y="581" text-anchor="middle" class="strong" fill="#b6f3df">Pristine task state</text>
  <text x="315" y="600" text-anchor="middle" class="small" fill="#8bd5bd">read-only evidence source</text>
  <path d="M525 582 C565 582 565 515 582 508" fill="none" stroke="#36d399" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Selector -->
  <rect x="1295" y="280" width="205" height="245" rx="20" fill="#183047" stroke="#4b91ac" stroke-width="2"/>
  <circle cx="1332" cy="318" r="19" fill="#67d0e8"/>
  <text x="1332" y="324" text-anchor="middle" class="number">3</text>
  <text x="1364" y="326" class="boxTitle">Selector</text>
  <text x="1398" y="376" text-anchor="middle" class="strong">Choose one winner</text>
  <text x="1398" y="410" text-anchor="middle" class="body">Rank by success score</text>
  <text x="1398" y="440" text-anchor="middle" class="body">Reject invalid runs</text>
  <text x="1398" y="470" text-anchor="middle" class="body">Compare close runs</text>
  <line x1="1258" y1="405" x2="1280" y2="405" stroke="#67d0e8" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Execution -->
  <rect x="55" y="706" width="1490" height="145" rx="24" fill="#16332f" stroke="#34836f" stroke-width="2"/>
  <rect x="78" y="727" width="260" height="38" rx="19" fill="#263847"/>
  <text x="99" y="753" class="bandTitle" fill="#d4deea">REAL EXECUTION</text>
  <rect x="1278" y="727" width="238" height="38" rx="19" fill="#16473b" stroke="#38aa86"/>
  <text x="1397" y="753" text-anchor="middle" class="bandTitle" fill="#91f0d1">EXACTLY 1 COMMIT</text>

  <circle cx="385" cy="790" r="19" fill="#36d399"/>
  <text x="385" y="796" text-anchor="middle" class="number">4</text>
  <rect x="420" y="766" width="255" height="55" rx="16" fill="#1d3b43" stroke="#42a18d" stroke-width="2"/>
  <text x="547" y="790" text-anchor="middle" class="strong">Commit chokepoint</text>
  <text x="547" y="811" text-anchor="middle" class="small">replay winner once</text>

  <line x1="675" y1="793" x2="755" y2="793" stroke="#36d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="772" y="766" width="255" height="55" rx="16" fill="#183f38" stroke="#42a18d" stroke-width="2"/>
  <text x="899" y="790" text-anchor="middle" class="strong">Real environment</text>
  <text x="899" y="811" text-anchor="middle" class="small">only state mutation</text>

  <line x1="1027" y1="793" x2="1107" y2="793" stroke="#36d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="1124" y="766" width="235" height="55" rx="16" fill="#1d3b43" stroke="#42a18d" stroke-width="2"/>
  <text x="1241" y="790" text-anchor="middle" class="strong">Official evaluator</text>
  <text x="1241" y="811" text-anchor="middle" class="small">ground-truth reward</text>

  <!-- Winner path -->
  <path d="M1398 525 C1398 665 548 642 548 752" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <rect x="885" y="668" width="220" height="32" rx="16" fill="#2b234a" stroke="#8656bc"/>
  <text x="995" y="690" text-anchor="middle" class="pill" fill="#dec9f8">ONE WINNING TRAJECTORY</text>

  <!-- Footer -->
  <text x="74" y="883" class="small">Benchmark adapters:</text>
  <rect x="225" y="859" width="105" height="34" rx="17" fill="#172b45" stroke="#3f628e"/>
  <text x="277" y="882" text-anchor="middle" class="pill">τ²-bench</text>
  <rect x="345" y="859" width="122" height="34" rx="17" fill="#172b45" stroke="#3f628e"/>
  <text x="406" y="882" text-anchor="middle" class="pill">AppWorld</text>
  <rect x="482" y="859" width="137" height="34" rx="17" fill="#172b45" stroke="#3f628e"/>
  <text x="550" y="882" text-anchor="middle" class="pill">OfficeBench</text>
  <rect x="634" y="859" width="158" height="34" rx="17" fill="#172b45" stroke="#3f628e"/>
  <text x="713" y="882" text-anchor="middle" class="pill">Terminal-Bench</text>
</svg>
