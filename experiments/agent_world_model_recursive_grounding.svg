<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9fb2cc"/>
    </marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c084fc"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#36d399"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 46px; font-weight: 700; fill: #edf3fb; }
      .subtitle { font-family: Arial, sans-serif; font-size: 23px; fill: #a9bad1; }
      .section { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 1.3px; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #edf3fb; }
      .subBoxTitle { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #edf3fb; }
      .body { font-family: Arial, sans-serif; font-size: 21px; fill: #b7c5d8; }
      .agentBody { font-family: Arial, sans-serif; font-size: 18px; fill: #b7c5d8; }
      .wmBody { font-family: Arial, sans-serif; font-size: 17px; fill: #b7c5d8; }
      .strong { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #e2eaf5; }
      .label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #b8c8da; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0e192b"/>
  <text x="72" y="76" class="title">Agent ↔ World Model</text>
  <text x="72" y="116" class="subtitle">Recursive evidence gathering — not recursive spawning of new LLM agents.</text>

  <!-- Agent -->
  <rect x="70" y="235" width="320" height="360" rx="25" fill="#1b3558" stroke="#578bd0" stroke-width="2.5"/>
  <rect x="96" y="260" width="135" height="40" rx="20" fill="#294c78"/>
  <text x="163" y="287" text-anchor="middle" class="section" fill="#c0d9fb">AGENT</text>
  <text x="110" y="355" class="boxTitle">Official Agent LLM</text>
  <text x="230" y="416" text-anchor="middle" class="agentBody">chooses tool calls</text>
  <text x="230" y="458" text-anchor="middle" class="agentBody">receives predicted observations</text>
  <text x="230" y="500" text-anchor="middle" class="agentBody">builds one candidate trajectory</text>

  <!-- Router -->
  <rect x="465" y="300" width="245" height="230" rx="22" fill="#202d3f" stroke="#687d98" stroke-width="2"/>
  <rect x="490" y="324" width="195" height="38" rx="19" fill="#2d4056"/>
  <text x="587" y="350" text-anchor="middle" class="section" fill="#d4deea">ROUTER / HARNESS</text>
  <text x="587" y="413" text-anchor="middle" class="strong">ordinary code</text>
  <text x="587" y="454" text-anchor="middle" class="body">intercepts calls</text>
  <text x="587" y="491" text-anchor="middle" class="body">tracks candidate state</text>

  <!-- Agent/router arrows -->
  <line x1="390" y1="360" x2="451" y2="360" stroke="#60a5fa" stroke-width="3" marker-end="url(#blue)"/>
  <text x="420" y="340" text-anchor="middle" class="label">tool call</text>
  <line x1="451" y1="485" x2="405" y2="485" stroke="#9fb2cc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="428" y="515" text-anchor="middle" class="label">observation</text>

  <!-- World model -->
  <rect x="790" y="170" width="740" height="590" rx="26" fill="#231f3f" stroke="#8e5cc6" stroke-width="2.5"/>
  <rect x="818" y="194" width="220" height="40" rx="20" fill="#3a275e"/>
  <text x="928" y="221" text-anchor="middle" class="section" fill="#e2ccfa">WORLD MODEL</text>

  <!-- Predictor -->
  <rect x="835" y="278" width="300" height="190" rx="20" fill="#332451" stroke="#a86ce6" stroke-width="2"/>
  <circle cx="874" cy="318" r="11" fill="#c084fc"/>
  <text x="985" y="327" text-anchor="middle" class="subBoxTitle">Observation predictor</text>
  <text x="985" y="386" text-anchor="middle" class="wmBody">runs on every tool call</text>
  <text x="985" y="426" text-anchor="middle" class="wmBody">predicts response + new state</text>

  <!-- Verifier -->
  <rect x="1180" y="278" width="305" height="190" rx="20" fill="#19374d" stroke="#4da8c7" stroke-width="2"/>
  <circle cx="1219" cy="318" r="11" fill="#67d0e8"/>
  <text x="1332" y="327" text-anchor="middle" class="subBoxTitle">Success verifier</text>
  <text x="1332" y="386" text-anchor="middle" class="wmBody">runs after the trajectory</text>
  <text x="1332" y="426" text-anchor="middle" class="wmBody">returns success / confidence</text>

  <!-- Router to predictor -->
  <line x1="710" y1="360" x2="821" y2="360" stroke="#c084fc" stroke-width="3" marker-end="url(#purple)"/>
  <text x="765" y="340" text-anchor="middle" class="label">predict</text>
  <line x1="821" y1="445" x2="724" y2="445" stroke="#9fb2cc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Predictor to verifier -->
  <line x1="1135" y1="373" x2="1166" y2="373" stroke="#67d0e8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1150" y="351" text-anchor="middle" class="label">trajectory</text>

  <!-- Recursive grounding -->
  <rect x="865" y="525" width="555" height="170" rx="23" fill="#153b37" stroke="#37a584" stroke-width="2.5"/>
  <text x="1142" y="565" text-anchor="middle" class="boxTitle" fill="#b8f0df">Recursive grounding loop</text>

  <circle cx="955" cy="623" r="45" fill="#204d48" stroke="#45bd9a" stroke-width="2"/>
  <text x="955" y="631" text-anchor="middle" class="strong">Ask</text>

  <circle cx="1142" cy="623" r="45" fill="#204d48" stroke="#45bd9a" stroke-width="2"/>
  <text x="1142" y="631" text-anchor="middle" class="strong">Read</text>

  <circle cx="1329" cy="623" r="45" fill="#204d48" stroke="#45bd9a" stroke-width="2"/>
  <text x="1329" y="631" text-anchor="middle" class="strong">Update</text>

  <line x1="1000" y1="623" x2="1083" y2="623" stroke="#36d399" stroke-width="3" marker-end="url(#green)"/>
  <line x1="1187" y1="623" x2="1270" y2="623" stroke="#36d399" stroke-width="3" marker-end="url(#green)"/>
  <path d="M1329 578 C1329 505 955 505 955 564" fill="none" stroke="#36d399" stroke-width="3" marker-end="url(#green)"/>
  <text x="1142" y="513" text-anchor="middle" class="label">repeat only if more evidence is needed</text>

  <!-- Both subagents use the loop -->
  <path d="M985 468 L985 511" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#purple)"/>
  <path d="M1332 468 L1332 511" fill="none" stroke="#67d0e8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Read-only source -->
  <rect x="420" y="800" width="760" height="65" rx="22" fill="#123d35" stroke="#2e9678" stroke-width="2"/>
  <text x="800" y="840" text-anchor="middle" class="boxTitle" fill="#b8f0df">Pristine state · read-only tools · no write handle</text>
  <path d="M800 800 C800 725 955 725 955 682" fill="none" stroke="#36d399" stroke-width="3" marker-end="url(#green)"/>
</svg>
