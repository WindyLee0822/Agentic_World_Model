[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-recursive-real"
version = "0.4.0"
description = "Trajectory-level read-grounded test-time scaling over the real AppWorld and tau2-bench environments"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
appworld = [
    "appworld @ https://github.com/StonyBrookNLP/appworld/archive/a072b7a86e7c1d5b1d7175659d750ebb9b79f10a.zip",
]
llm = ["openai>=1.30.0", "azure-identity>=1.15.0"]
progress = ["tqdm>=4.0"]
terminalbench = [
    "harbor==0.18.0",
    "terminal-bench==0.2.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
