[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-recursive-real"
version = "0.4.0"
description = "Trajectory-level read-grounded test-time scaling over the real AppWorld and tau2-bench environments"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
appworld = ["appworld>=0.1.3"]
llm = ["openai>=1.30.0", "azure-identity>=1.15.0"]
progress = ["tqdm>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
