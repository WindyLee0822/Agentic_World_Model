[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-recursive-real"
version = "0.4.0"
description = "Agentic World Modeling for agent test-time scaling without environment replicas"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
appworld = [
    "appworld @ https://github.com/StonyBrookNLP/appworld/archive/a072b7a86e7c1d5b1d7175659d750ebb9b79f10a.zip",
]
llm = ["openai>=1.30.0", "azure-identity>=1.15.0"]
progress = ["tqdm>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
tts = ["env/prompts/*.txt", "env/officebench_docker/*"]
tts_qwen = ["SOURCE.json", "env/prompts/*.txt", "env/officebench_docker/*"]
